[package]
name = "rocksmap-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Lokesh"]
description = "Command-line inspector and operator for rocksmap databases"
license = "MIT"
repository = "https://github.com/kumarlokesh/rocksmap"
readme = "README.md"
keywords = ["database", "rocksdb", "cli", "key-value"]
categories = ["command-line-utilities", "database"]

[dependencies]
rocksmap = { path = ".." }
rocksdb = "0.21.0"
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2"
predicates = "3"
